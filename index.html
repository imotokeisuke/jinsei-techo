<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>人生手帳</title>
<meta name="description" content="日々の日記と、人生で大事にしたい学びや思考を記録するノート">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="人生手帳">
<meta name="theme-color" content="#FF9B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <div class="app-header">
    <div class="app-title-wrap">
      <span class="app-title" id="appTitleText">人生手帳</span>
      <input class="app-title-input" id="appTitleInput" style="display:none;" maxlength="20">
      <button class="title-edit-btn" id="titleEditBtn" aria-label="タイトルを編集">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <button class="header-icon-btn" id="calendarBtn" aria-label="足あとカレンダー">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
    </button>
  </div>

  <!-- タブコンテンツ -->
  <div class="tab-content">

    <!-- 日記タブ -->
    <div class="tab-panel active" id="panel-diary">
      <div class="tree-widget">
        <div id="treeSvgWrap"></div>
        <div class="tree-info">
          <div class="tree-stage-label" id="treeStageLabel"></div>
          <div class="tree-sub-label" id="treeSubLabel"></div>
          <div class="tree-next" id="treeNextLabel"></div>
        </div>
      </div>
      <div class="search-row">
        <input type="text" class="search-input" id="diarySearchInput" placeholder="日記を検索（自由検索）">
      </div>
      <div class="chip-row" id="diaryCatChips"></div>
      <div id="diaryList"></div>
    </div>

    <!-- 人生手帳タブ -->
    <div class="tab-panel" id="panel-notebook">
      <div class="search-row" style="margin-top:14px;">
        <input type="text" class="search-input" id="notebookSearchInput" placeholder="人生手帳を検索（自由検索）">
      </div>
      <div class="chip-row" id="notebookMajorChips"></div>
      <div class="chip-row" id="notebookMinorChips"></div>
      <div id="notebookList"></div>
    </div>

    <!-- マイライフタブ -->
    <div class="tab-panel" id="panel-mylife">
      <div class="section-title" style="margin-top:14px;">わたしのマインドマップ</div>
      <div class="mindmap-wrap">
        <div id="mindmapSvgWrap"></div>
        <div class="mindmap-hint">円をタップすると、関連する記録が見られます</div>
      </div>
      <div class="summary-grid" id="mylifeSummary"></div>
      <div id="mylifeFilteredList" style="margin-top:6px;"></div>
    </div>

  </div>

  <!-- 下部タブバー -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="diary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>日記</span>
    </button>
    <button class="tab-btn" data-tab="notebook">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>人生手帳</span>
    </button>
    <button class="tab-btn" data-tab="mylife">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M9.5 10.5 6.5 7.5M14.5 10.5l3-3M9.5 13.5l-3 3M14.5 13.5l3 3"/></svg>
      <span>マイライフ</span>
    </button>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab" aria-label="新規追加">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div id="modalArea"></div>
  </div>

  <!-- ミニダイアログ（confirm / prompt の自作代替：iOS PWAでの標準ダイアログ問題を回避） -->
  <div class="mini-overlay" id="miniOverlay">
    <div class="mini-card" id="miniCard"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- カレンダー用モーダルテンプレート（openModal()で共通オーバーレイに描画） -->
<template id="calendarTemplate">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">足あとカレンダー</div>
    <div class="cal-header">
      <button class="cal-nav-btn" id="calPrev">‹</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav-btn" id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="calClose">閉じる</button>
    </div>
  </div>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
